<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta name="description" content="Dominic OS - premium personal command center for training, health, productivity, school, admin, and review." />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <title>Dominic OS</title>
  <link rel="manifest" href="manifest.json" />
